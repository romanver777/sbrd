<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pixi + Skia Рендерер</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #ffffff;
        color: #2a2a2a;
        font-family: "Arial", sans-serif;
        font-size: 0.75rem;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 24px 16px;
      }

      h1 {
        font-size: 1.1rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #00c3ff;
        margin-bottom: 8px;
        font-weight: 400;
      }

      .subtitle {
        color: #555555;
        letter-spacing: 0.1em;
        margin-bottom: 28px;
      }

      .canvases {
        display: flex;
        gap: 20px;
        margin-bottom: 24px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .canvas-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }

      .canvas-label {
        letter-spacing: 0.15em;
        color: #888;
        text-transform: uppercase;
      }

      .canvas-label span {
        color: #00c3ff;
      }

      canvas {
        border: 1px solid #2a2a3a;
        border-radius: 16px;
        background: #ffffff;
        display: block;
      }

      #skia-canvas {
        border-color: #2a2a2a;
      }

      .controls {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
      }

      button {
        background: transparent;
        border: 1px solid #2a2a2a;
        border-radius: 14px;
        color: #2a2a2a;
        font-family: "Arial", sans-serif;
        font-size: 0.75rem;
        letter-spacing: 0.1em;
        padding: 10px 22px;
        cursor: pointer;
        text-transform: uppercase;
        transition: all 0.15s;
      }

      button:hover {
        background: #ededed;
      }

      button:active {
        background: #dedede;
      }

      #status {
        margin-top: 16px;
        letter-spacing: 0.08em;
        min-height: 18px;
      }

      #status.err {
        color: #ff0000;
      }
    </style>
  </head>
  <body>
    <h1>Pixi.js &nbsp;+&nbsp; Skia</h1>
    <p class="subtitle">Векторный рендерер с экспортом в PDF</p>
    <div class="canvases">
      <div class="canvas-wrap">
        <div class="canvas-label">Канвас 1 — <span>Pixi.js</span></div>
        <canvas id="pixi-canvas" width="400" height="300"></canvas>
      </div>
      <div class="canvas-wrap">
        <div class="canvas-label">Канвас 2 — <span>Skia</span></div>
        <canvas id="skia-canvas" width="400" height="300"></canvas>
      </div>
    </div>
    <div class="controls">
      <button id="btn-add">＋ Добавить фигуру</button>
      <button id="btn-pdf">↓ Сохранить в PDF</button>
    </div>
    <div id="status">Инициализация…</div>
    <div id="action-status"></div>

    <script type="module" src="src/index.ts"></script>
  </body>
</html>
